name: 5x Daily Automated Instagram Reel Poster

on:
  schedule:
    # Runs 5x Daily in IST (UTC + 5:30):
    # 03:30 UTC = 9:00 AM IST
    # 07:00 UTC = 12:30 PM IST
    # 10:30 UTC = 4:00 PM IST
    # 14:00 UTC = 7:30 PM IST
    # 17:00 UTC = 10:30 PM IST
    - cron: '30 3,10 * * *'
    - cron: '0 7,14,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-next-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg, Color Emojis, & Playwright Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-color-emoji
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Render & Publish Next Reel
        env:
          IG_USER_ID: "17841435829048294"
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python auto_reel_poster.py --publish

      - name: Commit updated queue.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add queue.json
          git diff --staged --quiet || git commit -m "Auto-published next WhatsApp Reel"
          git push
