name: 5x Daily Automated Instagram Reel Poster

on:
  schedule:
    # Wakes up every 20 minutes; Python checks IG API and posts 1 Reel every ~4 hours (5x/day)
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-next-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg, Color Emojis, & Playwright Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-color-emoji
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Render & Publish Next Reel
        env:
          IG_USER_ID: "17841435829048294"
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python auto_reel_poster.py --publish

      - name: Save updated queue.json
        run: |
          git config user.name "ytehsin"
          git config user.email "ytehsin@users.noreply.github.com"
          git add queue.json
          git diff --staged --quiet || git commit -m "Update queue.json after Reel publish"
          git push
