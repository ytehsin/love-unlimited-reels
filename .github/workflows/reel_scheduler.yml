name: 5x Daily Automated Instagram Reel Poster

on:
  schedule:
    # Off-peak UTC cron minutes (IST = UTC + 5:30):
    # 03:37 UTC = 9:07 AM IST
    # 07:58 UTC = 1:28 PM IST (Next automatic run today!)
    # 10:37 UTC = 4:07 PM IST
    # 14:07 UTC = 7:37 PM IST
    # 17:07 UTC = 10:37 PM IST
    - cron: '37 3,10 * * *'
    - cron: '58 7 * * *'
    - cron: '7 14,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-next-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg, Color Emojis, & Playwright Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-color-emoji
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Render & Publish Next Reel
        env:
          IG_USER_ID: "17841435829048294"
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python auto_reel_poster.py --publish
