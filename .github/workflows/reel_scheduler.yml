name: 5x Daily Automated Instagram Reel Poster

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Bypass 3.5-hour cooldown gate and publish immediately'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: ig-reel-poster
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post-next-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Emoji Font & Playwright Chromium (Zero apt-get)
        run: |
          mkdir -p ~/.local/share/fonts
          curl -sL --retry 3 https://github.com/googlefonts/noto-emoji/raw/main/fonts/NotoColorEmoji.ttf -o ~/.local/share/fonts/NotoColorEmoji.ttf
          fc-cache -f ~/.local/share/fonts
          pip install -q playwright requests
          playwright install chromium

      - name: Render & Publish Next Reel
        env:
          IG_USER_ID: "17841435829048294"
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FORCE_PUBLISH: ${{ inputs.force_publish || 'false' }}
        run: python -u auto_reel_poster.py --publish

      - name: Save updated queue.json
        run: |
          git config user.name "ytehsin"
          git config user.email "ytehsin@users.noreply.github.com"
          git add queue.json
          if ! git diff --staged --quiet; then
            git commit -m "Update queue.json after Reel publish"
            git pull --rebase origin main || (git rebase --abort && git pull origin main && git add queue.json && git commit -m "Update queue.json after Reel publish")
            git push origin main
          fi
